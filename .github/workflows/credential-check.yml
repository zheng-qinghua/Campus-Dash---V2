name: Credential checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate credential rules
        run: |
          python3 campus-dash-backend/scripts/test_check_secrets.py
          python3 campus-dash-backend/scripts/test_secret_env.py
          python3 campus-dash-backend/scripts/check-secrets.py
